name: CI

# Build, vet and test the server and the recorder client (issues #30, #32),
# as PagerArchive's CI does: actions pinned to commit SHAs, least-privilege
# permissions, and a time limit on every job well above its usual time, so a
# hang fails in minutes rather than after GitHub's 6 hours.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    # Documentation-only changes don't run CI: no test or build reads them.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request's branch cancels that pull request's run still
# in progress. Every other run gets a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build, vet and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      RADIOARCHIVE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      # The database tests fail, never skip, if the database is missing.
      RADIOARCHIVE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The recorder client's Opus encoder (internal/opus) is cgo + libopus.
      - name: libopus
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: sqlc generated code is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: The API doesn't depend on this repo's cgo packages
        # A38 keeps the API cgo-free; only the recorder client uses libopus.
        run: |
          cgo=$(go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./cmd/radioarchive | grep '^github.com/RIKIKU/' || true)
          if [ -n "$cgo" ]; then echo "FAIL: the API imports cgo packages: $cgo" >&2; exit 1; fi
          echo "ok: the API imports none of this repo's cgo packages"
      - name: Tests (unit, integration against PostgreSQL, and A1-A4 end to end in process)
        run: go test -count=1 -v ./...

  # The browser app (issue #54): svelte-check, tokens only (R80), the build,
  # and the browser tests in Chromium, Firefox and WebKit against the
  # binary with the app in it and its database, then playback (A6, A7,
  # issue #58) with the recorder client and the fake recorder. As PagerArchive's: in
  # Microsoft's Playwright image at the version web/package-lock.json locks
  # (by digest), so the browsers and their libraries are already there, with
  # the database as a service container.
  #
  # One job per browser (Playwright's --project), side by side: each builds
  # the app and the binaries (about a minute) and has its own database and
  # recorder, so one browser's one-at-a-time @live tests don't wait on
  # another's. fail-fast is off: one browser's failure doesn't cancel the
  # others. By hand, e2e-web.sh with no --project runs all three.
  web:
    name: Browser tests (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      RA_E2E_DATABASE_URL: postgres://postgres:test@postgres:5432/postgres?sslmode=disable
      # Firefox won't start as root with a home folder owned by someone else.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The container runs as root and the checkout is the runner's: git (and
      # so go build's version stamp) refuses a folder someone else owns.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The playback tests (issue #58) run the recorder client, which is cgo
      # with libopus, built here from source (no Docker in this container),
      # and Firefox plays Web Audio only to a sound server: PulseAudio,
      # playing to nothing, which e2e-web.sh starts.
      - name: The recorder client's build and a sound server
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev libopus-dev pkg-config pulseaudio
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Playwright is the image's version
        working-directory: web
        run: test "$(npx playwright --version)" = "Version 1.64.0"
      - name: svelte-check (no warnings)
        working-directory: web
        run: npm run check
      - name: Style tokens only (R80)
        working-directory: web
        run: npm run check:tokens
      - name: Build, then the browser tests against the binary
        id: e2e
        timeout-minutes: 40
        run: sh scripts/ci/e2e-web.sh --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The recorder client's image, for both of the recorder host's
  # architectures (SPEC.md R3). The Dockerfile cross-compiles, so no
  # emulation is needed.
  client-image:
    name: Recorder client image (amd64 + arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build for linux/amd64 and linux/arm64 with buildx
        run: |
          docker buildx create --name multi --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 -f recorder/client/Dockerfile .

  # A38 (SPEC.md section 8): the API is built with CGO_ENABLED=0 on
  # distroless static, and the check fails otherwise. Then the compose stack
  # runs: the API applies its migrations and /healthz answers, and A1 and
  # A10 run end to end through the real images.
  image:
    name: Image (A38), compose stack, A1, A10 and sign-in (A33) end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: The image's final stage is distroless static
        run: |
          base=$(grep -E '^FROM ' Dockerfile | tail -n 1 | awk '{print $2}')
          echo "final stage: $base"
          case "$base" in
            gcr.io/distroless/static-*) ;;
            *) echo "FAIL: the image isn't on distroless static" >&2; exit 1 ;;
          esac
      - name: Build the image and start the stack
        # Authentik is in the stack (ADR 0009), with made-up secrets made
        # for this run; its first start takes a minute or two.
        run: |
          sh scripts/dev-env.sh > .env
          docker compose up --build --detach --wait --wait-timeout 420
      - name: The image's binary is static and cgo-free
        run: |
          id=$(docker create radioarchive:dev)
          docker cp "$id:/usr/local/bin/radioarchive" ./radioarchive
          docker rm "$id"
          sh scripts/ci/check-static.sh ./radioarchive
      - name: The check fails a build with cgo enabled
        # The negative control: the same program built with cgo on (the
        # runner has a C compiler) must fail the check above, so the check
        # can't pass by checking nothing.
        run: |
          CGO_ENABLED=1 go build -o radioarchive-cgo ./cmd/radioarchive
          if sh scripts/ci/check-static.sh ./radioarchive-cgo; then
            echo "FAIL: the check passed a cgo build" >&2
            exit 1
          fi
          echo "ok: the check fails a cgo build"
      - name: The binary serves the app built into it at /
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | tee index.html
          grep -q '_app/immutable' index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/robots.txt | grep -qx 'Disallow: /'
      - name: Migrations ran and /healthz answers
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          docker compose exec -T db psql -U radioarchive -d radioarchive -tAc \
            "SELECT max(version_id) FROM goose_db_version" | tee version.txt
          test "$(cat version.txt)" -ge 2
      - name: The binary runs the nightly retention job (R88)
        # A deployment that has never run it runs it at start, and records
        # the run in the jobs table.
        run: |
          for i in $(seq 1 60); do
            ok=$(docker compose exec -T db psql -U radioarchive -d radioarchive -tAc \
              "SELECT ok FROM jobs WHERE name = 'nightly'")
            if [ "$ok" = t ]; then echo "ok: the nightly run is recorded"; exit 0; fi
            sleep 1
          done
          echo "FAIL: no successful nightly run recorded (got '$ok')" >&2
          exit 1
      - name: A1 end to end (fake recorder, client image, API image, PostgreSQL)
        run: |
          docker build -f recorder/client/Dockerfile -t radioarchive-client:ci .
          sh scripts/ci/e2e-a1.sh radioarchive-client:ci
      - name: A10 end to end (the binary's public API shows nothing of hidden 1003)
        run: sh scripts/ci/e2e-a10.sh radioarchive-client:ci
      - name: The metrics (R90) and no names in them or the API's log (A32)
        # After A1 and A10 put the fixture's calls through the real images:
        # /metrics answers only with the token, and neither it nor the
        # API's log names a fixture talkgroup or unit (ADR 0040).
        run: |
          token=$(sed -n 's/^METRICS_TOKEN=//p' .env)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)
          test "$code" = 401 || { echo "FAIL: /metrics without the token answered $code" >&2; exit 1; }
          curl --fail -sS -H "Authorization: Bearer $token" http://127.0.0.1:8080/metrics > metrics.txt
          grep -q '^radioarchive_build_info{version=' metrics.txt
          grep -q '^radioarchive_telemetry_dropped_total 0$' metrics.txt
          docker compose logs --no-color api > api.log
          if grep -nE 'Dispatch North|DISP N|Fireground 41|FG 41|Engine 1|Portables' metrics.txt api.log; then
            echo "FAIL: a fixture name is in the metrics or the API's log" >&2; exit 1
          fi
          echo "ok: $(grep -c '^radioarchive_' metrics.txt) samples, no fixture names"
      - name: Listener sign-in end to end (A33, with Authentik and Mailpit)
        # In Playwright's image at the version web/package-lock.json locks,
        # on the runner's network, against the stack started above.
        timeout-minutes: 20
        env:
          RA_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
        run: sh scripts/ci/e2e-signin.sh
      - name: The PowerShell module against the stack (issue #116)
        # The module's own sign-in, by browser and by device code, a second
        # window, the admin commands, A26's module part and no token
        # anywhere, in Playwright's image as above, with PowerShell 7.6.0
        # (the module's minimum) mounted in. GitHub's Windows runners can't
        # run the stack's Linux containers, so this runs on Linux only.
        timeout-minutes: 20
        env:
          RA_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
          POWERSHELL_TELEMETRY_OPTOUT: "1"
        run: |
          pwsh -NoProfile -NonInteractive -File ./scripts/ci/Install-PowerShell.ps1 -Version 7.6.0 \
            -Destination "$RUNNER_TEMP/pwsh" -ModulePath "$RUNNER_TEMP/psmodules"
          RA_PWSH_DIR="$RUNNER_TEMP/pwsh" RA_PS_MODULES="$RUNNER_TEMP/psmodules" sh scripts/ci/e2e-module.sh
      - name: Upload the sign-in Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signin-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The PowerShell module (issue #116, ADR 0028, docs/powershell-guidelines.md):
  # PSScriptAnalyzer with zero findings, the meta-tests, the unit tests with
  # the API mocked and the sign-in tests (the DPAPI file on Windows; a
  # SecretStore vault and no vault on Linux), on the module's minimum
  # (7.6.0) and the newest stable release, read when the job runs, on
  # Windows and Linux. Its behaviour against the stack is the image job's.
  powershell:
    name: PowerShell module (${{ matrix.os }}, PowerShell ${{ matrix.pwsh }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        pwsh: ["7.6.0", newest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      POWERSHELL_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PowerShell ${{ matrix.pwsh }} and the test modules
        shell: pwsh
        run: |
          $pwsh = ./scripts/ci/Install-PowerShell.ps1 -Version '${{ matrix.pwsh }}' -Destination (Join-Path $env:RUNNER_TEMP 'pwsh') -ModulePath (Join-Path $env:RUNNER_TEMP 'psmodules') | Select-Object -Last 1
          "RA_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: PSScriptAnalyzer, meta-tests, unit and sign-in tests
        shell: pwsh
        run: |
          $env:PSModulePath = Join-Path $env:RUNNER_TEMP 'psmodules'
          & $env:RA_PWSH -NoProfile -NonInteractive -File ./powershell/tests/Invoke-Tests.ps1 -ResultPath pester-results.xml
          exit $LASTEXITCODE
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-${{ matrix.os }}-${{ matrix.pwsh }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: pester-results.xml
          if-no-files-found: ignore
          retention-days: 14

  # The recorder plugin (issue #33, SPEC.md R1): trunk-recorder's official
  # v5.2.1 image with the plugin, built natively on amd64 and on arm64.
  # Each arch then runs the real trunk-recorder with the plugin against the
  # synthetic P25 fixture, and a Go test decodes everything the plugin sends
  # (recorder/plugin/plugintest). The .so is kept as an artifact for native
  # installs. Nothing is pushed to a registry yet.
  plugin:
    name: Recorder plugin (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the image (checks the trunk-recorder pin)
        run: docker buildx build --load --tag radioarchive-recorder:ci recorder/plugin
      - name: Export the .so and the fixture generator
        run: |
          docker buildx build --target so --output type=local,dest=out/so recorder/plugin
          docker buildx build --target p25gen --output type=local,dest=out/p25gen recorder/plugin
          file out/so/libradioarchive.so
          sha256sum out/so/libradioarchive.so | tee out/so/SHA256SUMS
      - name: trunk-recorder with the plugin against the P25 fixture
        env:
          RADIOARCHIVE_PLUGIN_IMAGE: radioarchive-recorder:ci
          RADIOARCHIVE_P25GEN: ${{ github.workspace }}/out/p25gen/p25gen
        run: go test -count=1 -v ./recorder/plugin/plugintest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libradioarchive-${{ matrix.arch }}
          path: out/so/
          if-no-files-found: error
