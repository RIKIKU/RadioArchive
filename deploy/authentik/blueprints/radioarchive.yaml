# RadioArchive as an OIDC client of Authentik (SPEC.md R103, R110, ADR 0009).
#
# This file is the part of RadioArchive's Authentik setup that both
# deployments load: standalone, beside radioarchive-standalone.yaml, and in
# the combined deployment (R103, R105), in PagerArchive's Authentik, which
# keeps its own sign-in, enrolment and brand. So it holds only what is
# RadioArchive's own: its OIDC provider and application, its sign-out flow,
# and the account its API uses to save listeners' settings. Nothing here
# names a flow of the standalone file.
#
# Applied automatically when mounted under /blueprints in the Authentik
# containers. Reads these environment variables (set in compose.yaml):
#   RA_APP_URL              the radio's public URL, e.g. https://radio.example.org
#   RA_OIDC_CLIENT_SECRET   the radio's OIDC client secret
#   RA_AUTHENTIK_API_TOKEN  the token the radio's API uses for Authentik's API
#
# Their names start RA_ so that they can sit beside PagerArchive's PA_ ones
# in one Authentik.
version: 1
metadata:
  name: RadioArchive
  labels:
    blueprints.goauthentik.io/description: RadioArchive's OIDC client, its sign-out and its API account
context:
  app_url: !Env [RA_APP_URL, "http://localhost:8080"]
entries:
  # ------------------------------------------------------------ sign-out
  # The provider's invalidation flow, which the radio's sign-out reaches
  # through the end-session endpoint (OIDC RP-initiated logout): it ends the
  # browser's Authentik session, then Authentik sends the browser back to
  # the post_logout_redirect_uri the radio sent, which must be the logout
  # URI registered below, with the id_token_hint Authentik requires.
  - model: authentik_flows.flow
    id: sign-out
    identifiers:
      slug: radioarchive-sign-out
    attrs:
      name: RadioArchive sign-out
      title: Signing out
      designation: invalidation
      authentication: none
  - model: authentik_stages_user_logout.userlogoutstage
    id: sign-out-stage
    identifiers:
      name: radioarchive-sign-out
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf sign-out
      stage: !KeyOf sign-out-stage
      order: 10

  # ------------------------------------------------------------------ OIDC
  # A confidential client: the radio's API holds the secret, and also sends
  # a PKCE challenge (S256) with every sign-in. The application's policy
  # below refuses a sign-in without one. The same client can serve the
  # admin's sign-in later (M4): an admin is a signed-in user in the
  # radioarchive-admins group (R55), which the API will check for itself.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: RadioArchive
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf sign-out
      client_type: confidential
      client_id: radioarchive
      client_secret: !Env RA_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Context app_url]
        - matching_mode: strict
          url: !Format ["%s/?signed_out=1", !Context app_url]
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_id # the user's ID, which the API's account reads profiles by
      grant_types: [authorization_code]
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app
    identifiers:
      slug: radioarchive
    attrs:
      name: RadioArchive
      provider: !KeyOf provider
      meta_launch_url: !Context app_url
      policy_engine_mode: all
  # PKCE is required: Authentik accepts a code without it. Application
  # policies run, uncached, when the browser asks to sign in, so the request
  # must carry an S256 challenge.
  - model: authentik_policies_expression.expressionpolicy
    id: pkce
    identifiers:
      name: radioarchive-pkce
    attrs:
      expression: |
        http = request.http_request
        if http is None or not http.path.endswith("/application/o/authorize/"):
            return True  # Authentik's own access checks
        if http.GET.get("code_challenge_method") == "S256" and http.GET.get("code_challenge"):
            return True
        ak_message("RadioArchive signs in with PKCE (S256) only.")
        return False
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      policy: !KeyOf pkce
      order: 0
  # Gives the API's role "view user" and "change user" on the user signing
  # in, and only on them, so the API can save their settings (see "the
  # API's account" below). Never refuses: sign-in only saves preferences
  # (R111), and listening never needs it (P3).
  - model: authentik_policies_expression.expressionpolicy
    id: profile-access
    identifiers:
      name: radioarchive-profile-access
    attrs:
      expression: |
        from authentik.rbac.models import Role

        user = request.user
        http = request.http_request
        if http is None or not http.path.endswith("/application/o/authorize/"):
            return True  # only when someone signs in to the radio
        if getattr(user, "pk", None) is None or user.is_anonymous:
            return True
        role = Role.objects.filter(name="RadioArchive API").first()
        if role is None:
            return True
        perms = ["authentik_core.view_user", "authentik_core.change_user"]
        powerful = (user.is_superuser or getattr(user, "type", None) != "internal"
                    or user.all_groups().filter(name="radioarchive-admins").exists())
        if powerful:
            role.remove_perms(perms, obj=user)
        else:
            role.assign_perms(perms, obj=user)
        return True
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      policy: !KeyOf profile-access
      order: 1

  # ------------------------------------------------- the API's account
  # Least privilege (ADR 0009). Saving a listener's settings into their
  # user's attributes takes "view user" and "change user": Authentik has
  # nothing narrower for attributes, and "change user" also lets its holder
  # rename a user, switch them off or change their groups (all but
  # superuser groups). So the role holds neither for every user: it holds
  # them only for each listener's own user, as object permissions, given
  # when that listener signs in to the radio (the policy below). Authentik's
  # administrators, radioarchive-admins' members and service accounts are
  # never given them, and lose them at their next sign-in if they had them.
  # The token can't create, delete or impersonate users, set passwords or
  # reach anyone who has never signed in to the radio.
  #
  # The token never expires; rotate it by changing RA_AUTHENTIK_API_TOKEN
  # and AUTHENTIK_API_TOKEN together.
  - model: authentik_rbac.role
    id: api-role
    identifiers:
      name: RadioArchive API
    attrs:
      permissions: []
  - model: authentik_core.group
    id: api-group
    identifiers:
      name: RadioArchive API
    attrs:
      is_superuser: false
      roles:
        - !KeyOf api-role
  - model: authentik_core.user
    id: api-user
    identifiers:
      username: radioarchive-api
    attrs:
      name: RadioArchive API
      type: service_account
      path: users/service
      groups:
        - !KeyOf api-group
  - model: authentik_core.token
    identifiers:
      identifier: radioarchive-api
    attrs:
      intent: api
      expiring: false
      user: !KeyOf api-user
      key: !Env RA_AUTHENTIK_API_TOKEN
