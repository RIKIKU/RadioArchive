# RadioArchive as an OIDC client of Authentik (SPEC.md R103, ADR 0009, ADR 0021,
# ADR 0025).
#
# This file is the part of RadioArchive's Authentik setup that both
# deployments load: standalone, beside radioarchive-standalone.yaml, and in
# the combined deployment (R103, R105), in PagerArchive's Authentik, which
# keeps its own sign-in, enrolment and brand. So it holds only what is
# RadioArchive's own: its OIDC provider and application, its email
# mapping and its sign-out flow. Authentik keeps only who people are;
# listeners' saved settings, and who is a radio admin, are in RadioArchive's
# database (ADR 0021, ADR 0025). Nothing here names a flow of the
# standalone file.
#
# Applied automatically when mounted under /blueprints in the Authentik
# containers. Reads these environment variables (set in compose.yaml):
#   RA_APP_URL              the radio's public URL, e.g. https://radio.example.org
#   RA_OIDC_CLIENT_SECRET   the radio's OIDC client secret
#
# Their names start RA_ so that they can sit beside PagerArchive's PA_ ones
# in one Authentik.
version: 1
metadata:
  name: RadioArchive
  labels:
    blueprints.goauthentik.io/description: RadioArchive's OIDC clients (the radio's and the PowerShell module's) and their sign-out
context:
  app_url: !Env [RA_APP_URL, "http://localhost:8080"]
entries:
  # ------------------------------------------------------------ sign-out
  # The provider's invalidation flow, which the radio's sign-out reaches
  # through the end-session endpoint (OIDC RP-initiated logout): it ends the
  # browser's Authentik session, then Authentik sends the browser back to
  # the post_logout_redirect_uri the radio sent, which must be the logout
  # URI registered below, with the id_token_hint Authentik requires.
  - model: authentik_flows.flow
    id: sign-out
    identifiers:
      slug: radioarchive-sign-out
    attrs:
      name: RadioArchive sign-out
      title: Signing out
      designation: invalidation
      authentication: none
  - model: authentik_stages_user_logout.userlogoutstage
    id: sign-out-stage
    identifiers:
      name: radioarchive-sign-out
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf sign-out
      stage: !KeyOf sign-out-stage
      order: 10

  # ------------------------------------------------------------------ OIDC
  # The email scope, as the radio's: Authentik's own mapping always says
  # email_verified false. This one says true while the user's address is
  # the one an emailed code proved (radioarchive-standalone.yaml's sign-up
  # records it in the radioarchive_email_proven attribute), ignoring case.
  # The API makes only a proven INITIAL_ADMIN_EMAIL the first admin
  # (ADR 0025). An operator who creates a user by hand vouches for the
  # address by setting that attribute to it (README.md).
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email
    identifiers:
      name: radioarchive-email
    attrs:
      scope_name: email
      description: Email address
      expression: |
        email = request.user.email or ""
        proven = str(request.user.attributes.get("radioarchive_email_proven") or "")
        return {"email": email, "email_verified": email != "" and proven.lower() == email.lower()}

  # A confidential client: the radio's API holds the secret, and also sends
  # a PKCE challenge (S256) with every sign-in. The application's policy
  # below refuses a sign-in without one. Admins sign in with the same
  # client: who is an admin is the radio's own database's to say (ADR
  # 0025), never an Authentik group's.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: RadioArchive
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf sign-out
      client_type: confidential
      client_id: radioarchive
      client_secret: !Env RA_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Context app_url]
        - matching_mode: strict
          url: !Format ["%s/?signed_out=1", !Context app_url]
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_id # the user's ID, which the API keys saved profiles by (ADR 0021)
      grant_types: [authorization_code]
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app
    identifiers:
      slug: radioarchive
    attrs:
      name: RadioArchive
      provider: !KeyOf provider
      meta_launch_url: !Context app_url
      policy_engine_mode: all
  # PKCE is required: Authentik accepts a code without it. Application
  # policies run, uncached, when the browser asks to sign in, so the request
  # must carry an S256 challenge.
  - model: authentik_policies_expression.expressionpolicy
    id: pkce
    identifiers:
      name: radioarchive-pkce
    attrs:
      expression: |
        http = request.http_request
        if http is None or not http.path.endswith("/application/o/authorize/"):
            return True  # Authentik's own access checks
        if http.GET.get("code_challenge_method") == "S256" and http.GET.get("code_challenge"):
            return True
        ak_message("RadioArchive signs in with PKCE (S256) only.")
        return False
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      policy: !KeyOf pkce
      order: 0

  # ------------------------------------------- the PowerShell module (ADR 0028)
  # The module's own public client, with no secret: a script on someone's
  # machine can't keep one. It signs in in the system browser with PKCE and
  # a loopback redirect on any port (RFC 8252), or with a device code (RFC
  # 8628) where there's no browser. offline_access gives a refresh token,
  # replaced at every use (threshold 0) and ending after 30 days unused. The
  # API takes its access tokens on admin routes only, by signature, issuer,
  # audience and expiry, then decides from the radio's own database whether
  # the account is an admin, at every request. sub_mode user_id gives the
  # same subject as the browser's sign-in, which is how the API finds the
  # account. The application's slug is the client ID, so the issuer is
  # AUTHENTIK_URL/application/o/radioarchive-powershell/.
  - model: authentik_providers_oauth2.oauth2provider
    id: module-provider
    identifiers:
      name: RadioArchive PowerShell
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf sign-out
      client_type: public
      client_id: radioarchive-powershell
      client_secret: ""
      redirect_uris:
        - matching_mode: regex
          url: '^http://127\.0\.0\.1:[0-9]{1,5}/$'
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_id # the browser's subject too: the account's key (ADR 0025)
      grant_types: [authorization_code, refresh_token, "urn:ietf:params:oauth:grant-type:device_code"]
      include_claims_in_id_token: true
      # Also the device code's lifetime: time to type the code elsewhere.
      access_code_validity: minutes=10
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      refresh_token_threshold: seconds=0
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
  - model: authentik_core.application
    id: module-app
    identifiers:
      slug: radioarchive-powershell
    attrs:
      name: RadioArchive PowerShell
      provider: !KeyOf module-provider
      meta_launch_url: blank://blank # not offered in Authentik's application library
      policy_engine_mode: all
  # PKCE is required here too: Authentik 2026.8 lets a public client trade a
  # code for tokens without it (ADR 0028). The same policy as the radio's;
  # a device code never reaches the authorize endpoint, so it passes.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf module-app
      policy: !KeyOf pkce
      order: 0

  # ------------------------------------- removed: the API's account
  # The API holds no Authentik token (ADR 0021): a signed-in listener's
  # saved settings are in RadioArchive's own database, and Authentik keeps
  # only who they are. An Authentik that loaded an earlier version of this
  # file still has the API's account, its token, and the policy that gave
  # the account "view user" and "change user" on each listener's user.
  # These entries delete them (the policy's binding and the role's object
  # permissions go with them), so no token of the radio's can change a
  # user's groups. On an Authentik that never had them they do nothing.
  - model: authentik_policies_expression.expressionpolicy
    state: absent
    identifiers:
      name: radioarchive-profile-access
  - model: authentik_core.token
    state: absent
    identifiers:
      identifier: radioarchive-api
  - model: authentik_core.user
    state: absent
    identifiers:
      username: radioarchive-api
  - model: authentik_core.group
    state: absent
    identifiers:
      name: RadioArchive API
  - model: authentik_rbac.role
    state: absent
    identifiers:
      name: RadioArchive API
