# RadioArchive's server (SPEC.md R85; docs/deploy.md). Attached to every
# release as compose.yaml: the API, its PostgreSQL, Authentik for sign-in,
# and the nightly backup. Unpack the release's radioarchive-config.tar.gz
# next to it, save env.example as .env and fill it in, then:
#
#   docker compose up -d
#
# Make your own changes only in compose.override.yaml, beside this file:
# an upgrade replaces this file and deploy/, never the override or .env.
# Ports bind to 127.0.0.1: your reverse proxy reaches them and does TLS.
#
# The API's image is named by its major.minor version, so `docker compose
# pull && docker compose up -d` brings in that version's patch releases; a
# new minor version is a new release's files (docs/deploy.md, "Upgrading").
name: radioarchive

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.8
  restart: unless-stopped
  # TCP keepalives, so a database connection that died without being closed
  # fails within about a minute and Authentik reconnects, as PagerArchive's.
  sysctls:
    net.ipv4.tcp_keepalive_time: 30
    net.ipv4.tcp_keepalive_intvl: 10
    net.ipv4.tcp_keepalive_probes: 3
    net.ipv4.tcp_retries2: 7
  # A hash of the files mounted below. Compose doesn't notice a changed file,
  # but a changed label makes `docker compose up -d` recreate the container,
  # so a release's changed blueprints take effect.
  labels:
    radioarchive.config: "6fd96fc0e354868d"
  environment:
    AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
    AUTHENTIK_POSTGRESQL__HOST: db
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD in .env}
    # The address browsers reach Authentik at, scheme and host only.
    AUTHENTIK_WEB__BASE_URL: ${AUTHENTIK_URL:?set AUTHENTIK_URL in .env}
    AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
    AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
    AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:-}
    AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:-}
    AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-true}
    AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL:-false}
    AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:?set SMTP_FROM in .env}
    # Authentik's own administrator (akadmin), for the deployment's operator.
    AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_ADMIN_EMAIL:?set AUTHENTIK_ADMIN_EMAIL in .env}
    AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASSWORD:?set AUTHENTIK_ADMIN_PASSWORD in .env}
    # Nothing leaves the deployment: no avatars from third parties, no
    # analytics, error reports or update checks.
    AUTHENTIK_AVATARS: initials
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    # Read by the blueprints in deploy/authentik/blueprints.
    RA_APP_URL: ${APP_URL:?set APP_URL in .env}
    RA_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
    # The key of the radio's accounts service account's token (ADR 0033).
    RA_AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:?set AUTHENTIK_API_TOKEN in .env}
    # Listeners may enrol themselves by emailed code (R103): true or false.
    RA_LISTENER_SIGNUP: ${LISTENER_SIGNUP:-true}
  # File by file: a file a later release drops can't stay in use.
  volumes:
    - ./deploy/authentik/blueprints/radioarchive.yaml:/blueprints/radioarchive/radioarchive.yaml:ro
    - ./deploy/authentik/blueprints/radioarchive-standalone.yaml:/blueprints/radioarchive/radioarchive-standalone.yaml:ro
    - ./deploy/authentik/templates/radioarchive/code.html:/templates/radioarchive/code.html:ro
    - ./deploy/authentik/templates/radioarchive/code.txt:/templates/radioarchive/code.txt:ro
  depends_on:
    db:
      condition: service_healthy
      restart: true

services:
  api:
    image: ghcr.io/rikiku/radioarchive:main
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://radioarchive:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/radioarchive?sslmode=disable
      RECORDINGS_DIR: /var/lib/radioarchive/recordings
      TZ: ${TZ:-UTC}
      NIGHTLY_AT: ${NIGHTLY_AT:-}
      RECORDINGS_MIN_FREE: ${RECORDINGS_MIN_FREE:-}
      RECORDINGS_EARLY_DELETE_FLOOR: ${RECORDINGS_EARLY_DELETE_FLOOR:-}
      RECORDER_NOTICE_AFTER: ${RECORDER_NOTICE_AFTER:-}
      # Listeners' sign-in (ADR 0009). The secret and the token are never
      # logged.
      APP_URL: ${APP_URL}
      AUTHENTIK_URL: ${AUTHENTIK_URL}
      AUTHENTIK_INTERNAL_URL: http://authentik-server:9000
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      # Beside PagerArchive (R102, R104): its address, for the app switcher,
      # and the parent domain the look cookie is shared on. Empty is
      # standalone.
      PAGERARCHIVE_URL: ${PAGERARCHIVE_URL:-}
      PAGERARCHIVE_NAME: ${PAGERARCHIVE_NAME:-}
      LOOK_COOKIE_DOMAIN: ${LOOK_COOKIE_DOMAIN:-}
      # Heavy-use limits (SPEC.md section 6.11). Empty is the default.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      LIMIT_REQUESTS: ${LIMIT_REQUESTS:-}
      LIMIT_PLAYBACK: ${LIMIT_PLAYBACK:-}
      LIMIT_LIVE_PER_CLIENT: ${LIMIT_LIVE_PER_CLIENT:-}
      LIMIT_LIVE_TOTAL: ${LIMIT_LIVE_TOTAL:-}
      LIMIT_ZIPS_PER_CLIENT: ${LIMIT_ZIPS_PER_CLIENT:-}
      LIMIT_ZIPS_TOTAL: ${LIMIT_ZIPS_TOTAL:-}
      LIMIT_ZIP_SPEED: ${LIMIT_ZIP_SPEED:-}
      LIMIT_ZIP_SPEED_TOTAL: ${LIMIT_ZIP_SPEED_TOTAL:-}
      # The bearer token /metrics asks for (R90). Unset, /metrics answers 404.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # The backup's state, for admins and /metrics, and the setup export it
      # keeps beside each night's dumps (R89).
      BACKUP_STATUS_FILE: /var/lib/radioarchive/backup-status/status.json
      SETUP_EXPORT_DIR: /var/lib/radioarchive/setup-export
      # The automatic upgrade's state (ADR 0044), once it's switched on:
      # deploy/auto-upgrade/auto-upgrade.sh enable sets AUTO_UPGRADE_STATUS_DIR.
      AUTO_UPGRADE_STATUS_FILE: /auto-upgrade/status.json
    ports:
      - "${API_BIND:-127.0.0.1:8080}:8080"
    volumes:
      # Recordings are files on a volume, never in the database (R20).
      - recordings:/var/lib/radioarchive/recordings
      - backup-status:/var/lib/radioarchive/backup-status:ro
      - setup-export:/var/lib/radioarchive/setup-export
      # Nothing until automatic upgrades are on.
      - ${AUTO_UPGRADE_STATUS_DIR:-/dev/null}:/auto-upgrade:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/radioarchive", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: radioarchive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: radioarchive
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD in .env}
    volumes:
      # postgres:18 keeps its data in a versioned folder under this one.
      - db:/var/lib/postgresql
      # Run once, when the volume is new.
      - ./deploy/postgres/10-authentik.sh:/docker-entrypoint-initdb.d/10-authentik.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radioarchive -d radioarchive"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 5

  # The nightly backup (R89, docs/deploy.md "Backups"): both databases,
  # call data left out, each night restore-checked, into BACKUP_DIR.
  # Recordings are never backed up.
  backup:
    image: postgres:18
    restart: unless-stopped
    entrypoint: [sh, /usr/local/bin/radioarchive-backup]
    command: [serve]
    labels:
      radioarchive.config: "e86475d4f319a444"
    environment:
      PGHOST: db
      PGUSER: radioarchive
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
      BACKUP_AT: ${BACKUP_AT:-04:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_UID: ${BACKUP_UID:-0}
      BACKUP_GID: ${BACKUP_GID:-0}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/radioarchive-backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - backup-status:/status
      - setup-export:/setup-export:ro
    depends_on:
      db:
        condition: service_healthy

  authentik-server:
    <<: *authentik
    command: server
    ports:
      - "${AUTHENTIK_BIND:-127.0.0.1:9000}:9000"

  authentik-worker:
    <<: *authentik
    command: worker

volumes:
  db:
  recordings:
  backup-status:
  setup-export:
