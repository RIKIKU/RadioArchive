# RadioArchive behind nginx (SPEC.md R74, R85; docs/deploy.md, "The reverse
# proxy"). Two server blocks: the radio and its Authentik, each on its own
# subdomain. TLS is yours: certificates, and the listen lines, as your
# setup has them (SWAG and Certbot write them for you).
#
# In RadioArchive's .env, TRUSTED_PROXY is this proxy's one address as the
# API sees it, so each listener counts as their own client for the
# heavy-use limits. That works because this file overwrites
# X-Forwarded-For with the address that connected to nginx: a listener
# can't put another address there.

# Optional: nginx's own limit on requests, in front of the API's (R74).
# limit_req_zone $binary_remote_addr zone=radioarchive:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name radio.example.org;
    # ssl_certificate ...; ssl_certificate_key ...;

    # Overwrite, never append: the API reads the last address only from
    # TRUSTED_PROXY (R70).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;

    # The metrics are for the monitoring stack, which reaches the API
    # directly: never from outside (R85).
    location = /metrics {
        return 404;
    }

    # The listener's live feed: a WebSocket that stays open for hours.
    location = /api/v1/live {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # The recorder clients, from their own hosts: a WebSocket for live audio
    # that stays open, and each call's recording uploaded whole.
    location /api/v1/recorder/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 64m;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # Zips are built while they stream, at up to 2 MB/s each (R65, R72):
    # nothing is buffered, and a long download isn't cut off.
    location /api/v1/zip {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # limit_req zone=radioarchive burst=20 nodelay;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 5m;
        # limit_req zone=radioarchive burst=50 nodelay;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.org;
    # ssl_certificate ...; ssl_certificate_key ...;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
